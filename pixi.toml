[workspace]
authors = ["alix559 <alex.jacob@coleintl.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "solid_lens"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
download = { cmd = "python -m solid_lens.download", description = "Download the PP-OCRv6 ONNX checkpoints" }
ocr = { cmd = "python -m solid_lens.ocr", description = "Run PP-OCRv6 medium OCR on an image" }
serve = { cmd = "python -m solid_lens.server", description = "Serve the OCR JSON API on port 5001" }
nbdev-export = { cmd = "nbdev-export", description = "Export notebooks into the solid_lens package" }
nbdev-test = { cmd = "nbdev-test", description = "Run the notebook lessons" }

[dependencies]
mojo = ">=1.1.0,<2"
max = ">=26.6.0,<27"
nbdev = ">=3.3.24,<4"
pillow = ">=12.3.0,<13"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.1.0,<8"
python-fasthtml = ">=0.14.13,<0.15"
pyclipper = ">=1.4.0,<2"
py-opencv = ">=5.0.0,<6"
